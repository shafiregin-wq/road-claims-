<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MITAK</title>
<meta name="description" content="Shared travel expenses for two colleagues: fuel, toll, food and parking.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MITAK">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="root"><div class="splash"><span class="logo" aria-hidden="true">M</span><p class="muted">Loading MITAK…</p></div></div>
<div id="shell" hidden>
  <header class="top">
    <div class="top-in">
      <button class="brandmark" data-act="go" data-to="home" aria-label="MITAK home"><span class="logo" aria-hidden="true">M</span><span class="name">MITAK</span></button>
      <span id="who"></span>
      <button class="icon-btn" id="gear" data-act="go" data-to="settings" aria-label="Settings"></button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Main"><div class="tabs-in" id="tabs"></div></nav>
  <button class="fab" id="fab" data-act="add-expense" hidden></button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">MITAK needs JavaScript turned on.</p></noscript>
</body>
</html>
