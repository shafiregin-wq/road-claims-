  const sh = openSheet("Restore backup");
  sh.body.innerHTML = `<p>This backup has <b>${data.expenses.length}</b> expenses, <b>${data.trips.length}</b> trips and <b>${photos.length}</b> receipt photos${data.exportedAt ? `, saved ${fmtDate(String(data.exportedAt).slice(0, 10))}` : ""}.</p><p class="hint">Records with the same ID are replaced. Everything else on this phone stays.</p>`;
  sh.foot.innerHTML = `<span class="grow"></span><button class="btn" data-x="no">Cancel</button><button class="btn brand" data-x="yes">Restore</button>`;
  sh.foot.addEventListener("click", async e => {
    const x = e.target.closest("[data-x]"); if (!x) return;
    if (x.dataset.x === "no") { sh.close(); return; }
    x.disabled = true; const b = busy("Restoring…");
    try {
      if (data.settings) { const { apiKey, ...rest } = data.settings; S.settings = mergeSettings({ ...rest, apiKey: S.settings.apiKey, lastBackup: S.settings.lastBackup }); await Store.saveSettings(); }
      for (const entry of photos) { const id = entry.name.split("/").pop().replace(/\.jpg$/i, ""); await Photos.put(id, new Blob([await entry.async("arraybuffer")], { type: "image/jpeg" })); }
      for (const t of data.trips) if (t && t.id) await Store.put("trips", t);
      for (const ex of data.expenses) if (ex && ex.id) await Store.put("expenses", ex);
      b.done(); sh.close(); toast("Backup restored");
    } catch (err) { b.done(); x.disabled = false; toast("Restore stopped part-way. Free up storage and try again.", "bad"); }
  });
});

/* ===================== Global events ===================== */
const ACT = {
  "add-expense": () => openExpense(null),
  "add-trip": () => openTrip(null),
  "go": b => go(b.dataset.to),
  "month": b => { S.month = shiftMonth(S.month, +b.dataset.d); render(); },
  "set-month": b => { S.month = b.dataset.m; render(); },
  "edit-expense": b => openExpense(b.dataset.id),
  "open-trip": b => openTripDetail(b.dataset.id),
  "view-receipt": b => openReceipt(b.dataset.id, +b.dataset.i),
  "excel": () => exportExcel(),
  "pdf": () => exportPdf(),
  "package": () => exportPackage(),
  "email": () => openEmail(),
  "xf-period": b => { S.xf.period = b.dataset.v; render(); },
  "show-missing": () => { S.xf = { ...S.xf, period: "month", missing: true, project: S.rp.project, q: "", type: "", status: "" }; go("expenses"); },
  "backup": () => backup(),
  "restore": () => $("#restoreFile").click(),
  "add-project": async () => {
    const i = $("#s-newproj"); const n = (i.value || "").trim(); if (!n) return;
    if (S.settings.projects.includes(n)) { toast(`${n} is already in the list.`); return; }
    S.settings.projects.push(n); S.settings.projectStatus[n] = "Pending"; render();
    try { await Store.saveSettings(); toast(`Added ${n}`); } catch (e) { toast("Couldn't save the project.", "bad"); }
  },
  "remove-project": async b => {
    const n = b.dataset.p; S.settings.projects = S.settings.projects.filter(p => p !== n); render();
    try { await Store.saveSettings(); toast(`Removed ${n}. Its expenses are kept.`); } catch (e) { toast("Couldn't save.", "bad"); }
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) go(t.dataset.to); });

let settingsTimer = null;
$("#main").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "x-q") { S.xf.q = el.value; render(); }
  if (el.dataset.s) {
    S.settings[el.dataset.s] = el.value;
    clearTimeout(settingsTimer); settingsTimer = setTimeout(() => Store.saveSettings().catch(() => toast("Couldn't save settings.", "bad")), 500);
  }
});
$("#main").addEventListener("change", async e => {
  const el = e.target, id = el.id;
  const map = { "x-from": "from", "x-to": "to", "x-project": "project", "x-type": "type", "x-status": "status" };
  if (map[id]) { S.xf[map[id]] = el.value; render(); return; }
  if (id === "x-missing") { S.xf.missing = el.checked; render(); return; }
  if (id === "r-month" || id === "r-year") { S.month = `${$("#r-year").value}-${pad($("#r-month").value)}`; render(); return; }
  if (id === "r-project") { S.rp.project = el.value; render(); return; }
  if (el.dataset.pstatus) { S.settings.projectStatus[el.dataset.pstatus] = el.value; try { await Store.saveSettings(); toast(`New ${el.dataset.pstatus} expenses start as ${el.value}`); } catch (err) { toast("Couldn't save.", "bad"); } return; }
  if (el.dataset.bulk) {
    const p = el.dataset.bulk, status = el.value; if (!status) return;
    const list = monthData(S.month, p).ex.filter(x => x.status !== status);
    try { for (const x of list) await Store.put("expenses", { ...x, status, updatedAt: Date.now() }); toast(`Marked ${p} expenses for ${monthLabel(S.month)} as ${status}`); }
    catch (err) { toast("Some expenses weren't updated. Try again.", "bad"); }
  }
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) { S.view = v; render(); } });

/* ===================== Boot ===================== */
function boot() {
  $("#logo").innerHTML = ic("route", 20);
  $("#mPrev").innerHTML = ic("chevL", 18); $("#mNext").innerHTML = ic("chevR", 18);
  $("#fab").innerHTML = `${ic("plus", 20)} Add Expense`;
  $("#tabs").innerHTML = TABS.map(([v, i, l]) => `<button class="tab" data-to="${v}">${ic(i, 22)}<span>${l}</span></button>`).join("");
  const dl = (id, arr) => `<datalist id="${id}">${arr.map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>`;
  document.body.insertAdjacentHTML("beforeend", dl("dl-places", PLACES) + dl("dl-stations", STATIONS) + dl("dl-tolls", TOLLS) + dl("dl-parking", PARKING) + dl("dl-purposes", PURPOSES));
  const h = location.hash.slice(1); if (VIEWS[h]) S.view = h;
  Store.init().catch(() => { $("#main").innerHTML = `<div class="note warn">Road Claims couldn't open its storage. If you're in a Private Browsing tab, open it in a normal Safari tab or from the home screen.</div>`; });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
})();
</script>
</body>
</html>
