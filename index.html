<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road Claims</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F4F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Road Claims">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first app shell. Sticky header with month stepper, one column (max 760px), fixed bottom tab bar, bottom sheets for forms. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --sunken:#E6EBEF; --ink:#111C25; --muted:#586673; --line:#D7DEE4;
  --accent:#F2A20C; --accent-ink:#1E1400; --brand:#0F4F5E; --brand-ink:#FFFFFF;
  --fuel:#D98200; --toll:#3B62D6; --park:#0B8A7B; --other:#7B66A8;
  --ok:#1D7A46; --warn:#B26700; --bad:#C2372D; --info:#2F5FC8; --neutral:#677380;
  --scrim:rgba(6,12,18,.5);
  --display:"Barlow Semi Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1217; --surface:#151E26; --sunken:#1C2731; --ink:#E4EBF1; --muted:#93A1AE; --line:#27333E;
  --accent:#F5B23A; --accent-ink:#1E1400; --brand:#6CC3D5; --brand-ink:#0C1217;
  --fuel:#F2A93B; --toll:#7D9BFF; --park:#3CC7B4; --other:#B7A4E0;
  --ok:#4CC38A; --warn:#F0A940; --bad:#FF7A70; --info:#7D9BFF; --neutral:#9AA5B0;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1217; --surface:#151E26; --sunken:#1C2731; --ink:#E4EBF1; --muted:#93A1AE; --line:#27333E;
  --accent:#F5B23A; --accent-ink:#1E1400; --brand:#6CC3D5; --brand-ink:#0C1217;
  --fuel:#F2A93B; --toll:#7D9BFF; --park:#3CC7B4; --other:#B7A4E0;
  --ok:#4CC38A; --warn:#F0A940; --bad:#FF7A70; --info:#7D9BFF; --neutral:#9AA5B0;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex:none;display:block}
.money{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.code{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Shell */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.name{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.month{display:flex;align-items:center;gap:2px}
.month span{font-family:var(--display);font-weight:600;min-width:84px;text-align:center;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
main{max-width:760px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:.68rem;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .ic{stroke-width:2.3}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:31;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab[hidden]{display:none}

/* Common blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad)}
.btn.solid-danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.xl{font-size:1.15rem;padding:16px;border-radius:14px;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.pill{--tone:var(--neutral);display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--tone) 15%,transparent);color:var(--tone);white-space:nowrap;line-height:1.5}
.pill.warn{--tone:var(--warn)} .pill.info{--tone:var(--info)} .pill.park{--tone:var(--park)} .pill.ok{--tone:var(--ok)} .pill.bad{--tone:var(--bad)} .pill.neutral{--tone:var(--neutral)}
.note{background:color-mix(in srgb,var(--brand) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line));border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* Dashboard */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.qa-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;font-weight:600;text-align:center;line-height:1.2;color:var(--ink)}
.qa-btn .ic{color:var(--brand)}
.hero{display:flex;flex-direction:column;gap:6px}
.big{font-size:2.6rem;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.cat-table{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.crow .bar{grid-column:2/-1;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.crow .bar i{display:block;height:100%;border-radius:3px}
.crow .clbl{font-weight:600}
.crow .cnt{color:var(--muted);font-size:.8rem;font-weight:400;margin-left:6px}
.dotc{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);grid-row:span 2}
.trow{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.alert b{color:var(--bad)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0;padding-bottom:0}
.prow:first-child{padding-top:0}
.prow-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pills{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}

/* Lists */
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:12px 14px;color:inherit}
.row:last-child{border-bottom:0}
.cat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.row-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.row-amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row-amt small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.76rem}
.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;color:var(--muted);font-size:.9rem}
.list-head .money{color:var(--ink);font-size:1.1rem}

/* Trips */
.trip{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;color:inherit}
.trip-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trip-title{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.2}
.trip-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);margin-top:4px}
.trip-stats b{color:var(--ink);font-weight:600}
.trip-stats span{display:inline-flex;align-items:center;gap:4px}

/* Filters */
.filters{display:flex;flex-direction:column;gap:10px;padding:12px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--muted)}
.search input{border:0;background:none;padding:11px 0;flex:1;min-width:0;outline:none;color:var(--ink)}
.frow{display:grid;gap:8px}
.frow.two{grid-template-columns:1fr 1fr}
.frow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.frow label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;font-size:16px}
textarea{min-height:76px;resize:vertical}
input[type="checkbox"]{width:20px;height:20px;padding:0;accent-color:var(--brand);flex:none}
.amount-in{font-family:var(--display);font-size:1.9rem;font-weight:700;padding:8px 12px 8px 62px;font-variant-numeric:tabular-nums}
.amount-wrap{position:relative}
.amount-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:600;color:var(--muted);font-size:1.1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.type .ic{color:var(--c)}
.chip.type[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.chip.type[aria-pressed="true"] .ic{color:var(--surface)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.seg.small .chip{padding:6px 10px;font-size:.85rem}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.hint{font-size:.84rem;color:var(--muted)}
.calc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.calc b{color:var(--ink);font-family:var(--display);font-weight:600}
details.more{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.more summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";color:var(--muted);font-weight:700}
details.more[open] summary::after{content:"–"}
details.more .inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-weight:600;font-size:.92rem}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:78px;height:100px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunken)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--scrim);color:#fff;display:grid;place-items:center;padding:0}
.upl{display:flex;flex-wrap:wrap;gap:8px}
.ocr{border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:color-mix(in srgb,var(--brand) 8%,var(--surface));border-radius:10px;padding:10px 12px;font-size:.88rem}
.attrib{font-size:.72rem;color:var(--muted)}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;height:calc(100% - 20px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface);flex-wrap:wrap;align-items:center}
.sheet-foot .grow{flex:1}
.sheet-foot:empty{display:none}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{height:auto;max-height:100%;border-radius:18px}}

/* Reports */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile-n{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile-n b{font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.pcard{display:flex;flex-direction:column;gap:4px}
.pc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc-head .money{font-size:1.35rem}
.pc-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:8px;font-size:.9rem}
.pc-foot select{width:auto;padding:7px 10px;font-size:16px}
.grand{display:flex;justify-content:space-between;align-items:baseline;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px 16px}
.grand .money{font-size:1.5rem}
.export{display:flex;flex-direction:column;gap:8px}
.export .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.hb-top span:first-child{display:flex;align-items:center;gap:8px}
.hb-track{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;margin-top:4px}
.hb-track i{display:block;height:100%;border-radius:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center}
.col-plot{position:relative;height:150px;width:100%;border-bottom:1px solid var(--line)}
.col-plot i{position:absolute;bottom:0;left:18%;right:18%;border-radius:5px 5px 0 0;background:color-mix(in srgb,var(--fuel) 55%,var(--sunken))}
.col.cur .col-plot i{background:var(--fuel)}
.col-plot span{position:absolute;left:0;right:0;text-align:center;font-size:.74rem;font-family:var(--display);font-weight:600;color:var(--ink)}
.col-l{font-size:.74rem;color:var(--muted);padding:6px 0 0;text-align:center}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Receipts */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rtile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);padding:0;text-align:left;display:flex;flex-direction:column;color:inherit}
.rtile img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--sunken);display:block;max-width:100%}
.rtile span{padding:8px 10px;font-size:.8rem;display:flex;flex-direction:column;gap:1px}
.lightbox img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--sunken)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.file .ic{color:var(--brand)}
.file div{flex:1;min-width:0}
.file b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;pointer-events:auto}
.toast.bad{background:var(--bad);color:var(--surface)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:420px){
  .stats{grid-template-columns:repeat(2,1fr)}

<script>
(() => {
"use strict";

/* ===================== Config ===================== */
const CATS = ["Fuel", "Toll", "Parking", "Other"];
const CAT_COLOR = { Fuel: "var(--fuel)", Toll: "var(--toll)", Parking: "var(--park)", Other: "var(--other)" };

const STATUSES = ["Pending", "Submitted", "Approved", "Reimbursed", "Not Reimbursable", "Unknown"];

const PLACES = ["Abu Dhabi", "Dubai", "Sharjah", "Ajman", "Umm Al Quwain", "Ras Al Khaimah", "Fujairah", "Al Ain", "Ruwais", "Mussafah", "Khalifa City", "Mohammed Bin Zayed City", "KIZAD", "Abu Dhabi Airport", "Madinat Zayed", "Mirfa", "Ghayathi", "Liwa", "Habshan", "Jebel Dhanna", "Sila", "Shahama", "Dubai Marina", "Deira", "Jebel Ali", "Dubai Airport", "Dubai Silicon Oasis", "Hatta", "Khor Fakkan", "Kalba", "Dibba"];

const TOLLS = ["Salik – Al Garhoud Bridge", "Salik – Al Maktoum Bridge", "Salik – Al Barsha", "Salik – Al Safa", "Salik – Al Safa South", "Salik – Airport Tunnel", "Salik – Al Mamzar", "Salik – Jebel Ali", "Salik – Business Bay Crossing", "Darb – Sheikh Zayed Bridge", "Darb – Sheikh Khalifa Bridge", "Darb – Al Maqta Bridge", "Darb – Mussafah Bridge"];
const PARKING = ["Mawaqif (Abu Dhabi)", "RTA Parking (Dubai)", "Sharjah Municipality", "Mall parking", "Site parking", "Airport parking"];
const CORE_PROJECTS = ["ADNOC", "CB", "Other"];
const DEFAULT_SETTINGS = { name: "", designation: "", employeeId: "", home: "", apiKey: "", lastBackup: "", projects: ["ADNOC", "CB", "Other"], projectStatus: { ADNOC: "Pending", CB: "Unknown", Other: "Pending" } };
const LIBS = {
  xlsx: "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js",
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",

const ANTHROPIC_SDK = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm";
const DRAFT_KEY = "roadclaims.draft.v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MIME = { xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", pdf: "application/pdf", zip: "application/zip", json: "application/json", jpg: "image/jpeg", txt: "text/plain" };

/* ===================== Utils ===================== */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const monthOf = iso => String(iso || "").slice(0, 7);
const parseISO = iso => { const [y, m, d] = String(iso).split("-").map(Number); return new Date(y, m - 1, d || 1); };
const validISO = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || "") && isoOf(parseISO(iso)) === iso;
const monthLabel = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
const monthShort = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS[m - 1].slice(0, 3)} ${y}`; };
const shiftMonth = (key, n) => { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const nf2 = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 });
const aed = n => "AED " + nf2.format(+n || 0);
const kmTxt = n => nf0.format(+n || 0) + " km";
const fmtDate = iso => { if (!validISO(iso)) return iso || ""; const d = parseISO(iso); return `${pad(d.getDate())} ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`; };
const fmtDMY = iso => validISO(iso) ? iso.split("-").reverse().join("/") : (iso || "");
const r2 = n => Math.round((+n || 0) * 100) / 100;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { if (v === "" || v == null) return null; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : NaN; };
const byNewest = (a, b) => (b.date || "").localeCompare(a.date || "") || (b.code || "").localeCompare(a.code || "");
const byOldest = (a, b) => -byNewest(a, b);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : Infinity;

const ICONS = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  route: '<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  chart: '<path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/>',

  camera: '<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',
  share: '<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  chevL: '<path d="M15 6l-6 6 6 6"/>',
  chevR: '<path d="M9 6l6 6-6 6"/>',
  sheet: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',
  pdf: '<path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'
};
const ic = (name, size = 20) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;

/* ===================== State ===================== */
const S = {
  trips: [], expenses: [], settings: structuredClone(DEFAULT_SETTINGS), ready: false, persisted: null,
  view: "dashboard", month: monthOf(todayISO()),
  xf: { q: "", period: "month", from: "", to: "", project: "", type: "", status: "", missing: false },
  rp: { project: "" }
};
const SHEETS = [];

/* ===================== Storage on this phone (IndexedDB) ===================== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("roadclaims", 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        ["expenses", "trips", "photos"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" }); });
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), q = fn(t.objectStore(store));
      t.oncomplete = () => res(q ? q.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.req(store, "readonly", s => s.getAll()); },
  get(store, key) { return this.req(store, "readonly", s => s.get(key)); },
  put(store, val, key) { return this.req(store, "readwrite", s => key === undefined ? s.put(val) : s.put(val, key)); },
  del(store, key) { return this.req(store, "readwrite", s => s.delete(key)); }
};
function mergeSettings(s) {
  const o = { ...DEFAULT_SETTINGS, ...(s || {}) };
  o.projects = Array.isArray(o.projects) && o.projects.length ? [...o.projects] : [...DEFAULT_SETTINGS.projects];
  o.projectStatus = { ...DEFAULT_SETTINGS.projectStatus, ...(o.projectStatus || {}) };
  return o;
}
const Store = {
  async init() {
    await DB.open();
    S.expenses = await DB.all("expenses"); S.trips = await DB.all("trips");
    S.settings = mergeSettings(await DB.get("kv", "settings"));
    S.ready = true; render();
    try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) {}
  },
  listOf(col) { return col === "trips" ? S.trips : S.expenses; },
  async put(col, obj) {
    const clean = JSON.parse(JSON.stringify(obj));
    await DB.put(col, clean);
    const list = this.listOf(col), i = list.findIndex(x => x.id === clean.id);
    if (i >= 0) list[i] = clean; else list.push(clean);
    render();
  },
  async remove(col, id) {
    await DB.del(col, id);
    if (col === "trips") S.trips = S.trips.filter(x => x.id !== id); else S.expenses = S.expenses.filter(x => x.id !== id);
    render();
  },
  async saveSettings() { await DB.put("kv", JSON.parse(JSON.stringify(S.settings)), "settings"); }
};
const Photos = {
  urls: new Map(),
  async add(blob) { const id = "p" + uid(); await DB.put("photos", { id, blob, type: blob.type || "image/jpeg", at: Date.now() }); return id; },
  async put(id, blob) { await DB.put("photos", { id, blob, type: blob.type || "image/jpeg", at: Date.now() }); },
  async blob(id) { const r = await DB.get("photos", id); return r ? r.blob : null; },
  async url(id) {
    if (this.urls.has(id)) return this.urls.get(id);
    const b = await this.blob(id); if (!b) return null;
    const u = URL.createObjectURL(b); this.urls.set(id, u); return u;
  },
  async remove(id) { await DB.del("photos", id); const u = this.urls.get(id); if (u) { URL.revokeObjectURL(u); this.urls.delete(id); } }
};
function hydratePhotos(root = document) {
  root.querySelectorAll("img[data-photo]:not([src])").forEach(async img => {
    const u = await Photos.url(img.dataset.photo).catch(() => null);
    if (u) img.src = u; else { img.alt = "Photo not found"; img.removeAttribute("data-photo"); }
  });
}
const photoImg = (id, alt) => `<img data-photo="${esc(id)}" alt="${esc(alt)}">`;

/* ===================== Libraries & files ===================== */
const libPromises = {};
function loadLib(key) {
  if (!libPromises[key]) libPromises[key] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = LIBS[key]; s.async = true;
    s.onload = () => res(); s.onerror = () => { delete libPromises[key]; rej(new Error("lib")); };
    document.head.appendChild(s);
  });
  return libPromises[key];
}
const toFile = (data, name) => new File([data], name, { type: MIME[name.split(".").pop().toLowerCase()] || "application/octet-stream" });
// Opens the iPhone share sheet (Save to Files, Mail, WhatsApp…). Falls back to a normal download.
async function shareFiles(files, opts = {}) {
  try {
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: opts.title || files[0].name, ...(opts.text ? { text: opts.text } : {}) });
      return "shared";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return "cancelled";
    if (e && e.name === "NotAllowedError") { toast("Tap the button again to share.", "bad"); return "blocked"; }
  }
  for (const f of files) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    await sleep(400);
  }
  toast(files.length > 1 ? `Saved ${files.length} files` : `Saved ${files[0].name}`);
  return "downloaded";
}
// Files are built first, then shown with a Share button: iPhone only opens the share sheet straight after a tap.
function showFiles(title, files, opts = {}) {
  const sh = openSheet(title);
  sh.body.innerHTML = `
    ${opts.intro ? `<p>${opts.intro}</p>` : ""}
    <div class="files">${files.map((f, i) => `<div class="file">${ic(f.name.endsWith(".pdf") ? "pdf" : f.name.endsWith(".zip") ? "box" : f.name.endsWith(".json") ? "copy" : "sheet", 24)}<div><b>${esc(f.name)}</b><span class="muted small">${fmtSize(f.size)}</span></div><button class="btn" data-share="${i}">${ic("share", 18)} Share</button></div>`).join("")}</div>
    ${files.length > 1 ? `<button class="btn primary xl" data-share="all">${ic("share", 22)} Share all ${files.length} files</button>` : `<button class="btn primary xl" data-share="0">${ic("share", 22)} Save or share</button>`}
    ${opts.email ? `<button class="btn brand" data-email>${ic("mail", 18)} Email with these attached</button>` : ""}
    <p class="hint">The share menu lets you save to Files, or send by Mail or WhatsApp.</p>`;
  sh.body.addEventListener("click", async ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.share != null) { const list = b.dataset.share === "all" ? files : [files[+b.dataset.share]]; await shareFiles(list, { title: list[0].name }); }
    if (b.hasAttribute("data-email") && opts.email) { const e = opts.email(); await shareFiles(opts.emailFiles || files, { title: e.subject, text: e.body }); }
  });
  return sh;
}

/* ===================== Domain ===================== */
const tripById = id => S.trips.find(t => t.id === id);
const tripKm = t => (t && +t.km > 0) ? (t.roundTrip ? t.km * 2 : +t.km) : 0;
const tripName = t => t ? `${t.purpose || "Trip"} — ${t.to || "?"}` : "";
const claimable = e => e.status === "Not Reimbursable" ? 0 : r2((+e.amount || 0) * (e.claimPct ?? 100) / 100);
const receiptCount = e => (e.receipts || []).length;
const receiptState = e => receiptCount(e) ? "Photo" : e.paperBill ? "Paper bill" : "Missing";
const describe = e => e.description || (e.type === "Fuel" ? (e.station ? `${e.station} fuel` : "Fuel") : (e.location || e.merchant || e.type));
const projectList = () => { const l = [...S.settings.projects]; S.expenses.forEach(e => { if (e.project && !l.includes(e.project)) l.push(e.project); }); return l; };
const projectOrder = obj => { const order = projectList(); return Object.keys(obj).sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99)); };
const defaultStatus = p => S.settings.projectStatus[p] || "Pending";
function lastProject() { const e = S.expenses.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0]; return e ? e.project : (S.settings.projects[0] || "ADNOC"); }
function nextCode(prefix, list, width) {
  let max = 0;
  list.forEach(x => { if (x.code && x.code.startsWith(prefix)) { const n = parseInt(x.code.slice(prefix.length), 10); if (n > max) max = n; } });
  return prefix + String(max + 1).padStart(width, "0");
}
function monthData(key, project) {
  const ex = S.expenses.filter(e => monthOf(e.date) === key && (!project || e.project === project));
  const tr = S.trips.filter(t => monthOf(t.date) === key && (!project || t.project === project));
  const z = () => ({ Fuel: 0, Toll: 0, Parking: 0, Other: 0 });
  const cat = z(), catN = z(), catClaim = z(), catVat = z(), proj = {}, status = {};
  let total = 0, claim = 0, vat = 0, receipts = 0, missing = 0, paper = 0;
  ex.forEach(e => {
    const a = +e.amount || 0, c = claimable(e), t = CATS.includes(e.type) ? e.type : "Other", st = e.status || "Pending";
    cat[t] += a; catN[t]++; catClaim[t] += c; catVat[t] += +e.vat || 0;
    total += a; claim += c; vat += +e.vat || 0;
    const n = receiptCount(e); receipts += n; if (!n) { if (e.paperBill) paper++; else missing++; }
    const p = proj[e.project] || (proj[e.project] = { ...z(), total: 0, claim: 0, n: 0, status: {} });
    p[t] += a; p.total += a; p.claim += c; p.n++; p.status[st] = (p.status[st] || 0) + 1;
    status[st] = (status[st] || 0) + a;
  });
  const dist = tr.reduce((s, t) => s + tripKm(t), 0);
  return { ex, tr, cat, catN, catClaim, catVat, proj, status, total: r2(total), claim: r2(claim), vat: r2(vat), receipts, missing, paper, dist, costPerKm: dist ? cat.Fuel / dist : null };
}
function fileBase(key, project) { const [y, m] = key.split("-").map(Number); return `${MONTHS[m - 1]}_${y}${project ? "_" + project.replace(/[^A-Za-z0-9]+/g, "_") : ""}`; }
function receiptFileName(e, i) { return `${e.code || e.id}_${i + 1}.jpg`; }

/* ===================== Maps: place search (OpenStreetMap) and road routing (OSRM) ===================== */
const Geo = {
  async search(q) {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ae&accept-language=en&q=${encodeURIComponent(q)}`, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("geo");
    const j = await r.json();
    return j && j.length ? { lat: +j[0].lat, lon: +j[0].lon, name: j[0].display_name } : null;
  },
  async reverse(lat, lon) {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=en&lat=${lat}&lon=${lon}`, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("geo");
    const j = await r.json(), a = j.address || {};
    const local = a.suburb || a.neighbourhood || a.quarter || a.city_district || a.road || "";
    const city = a.city || a.town || a.village || a.state || "";
    return [local, city].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(", ") || j.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  },
  async route(a, b) {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
    if (!r.ok) throw new Error("route");
    const j = await r.json();
    if (j.code !== "Ok" || !j.routes || !j.routes.length) throw new Error("route");
    return { km: j.routes[0].distance / 1000, minutes: j.routes[0].duration / 60 };
  },
  here() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error("nogps"));
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
  }
};

/* ===================== Receipt reading (optional, needs your Claude API key) ===================== */
const AI = {
  mod: null,
  available() { return !!(S.settings.apiKey && S.settings.apiKey.trim()); },
  async client() {
    if (!this.mod) this.mod = await import(ANTHROPIC_SDK);
    const Anthropic = this.mod.default || this.mod.Anthropic;
    return { Anthropic, client: new Anthropic({ apiKey: S.settings.apiKey.trim(), dangerouslyAllowBrowser: true }) };
  },
  async readReceipt(blob) {
    const { Anthropic, client } = await this.client();
    const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
    const prompt = `This photo is a receipt from the United Arab Emirates. It may be a fuel receipt (ADNOC Distribution, ENOC, EPPCO, Emarat), a toll record (Salik in Dubai, Darb in Abu Dhabi), a parking receipt (Mawaqif, RTA, municipality or mall parking) or another travel expense such as a taxi. Amounts are in AED. Dates on UAE receipts are usually day/month/year. Read it and reply with only one JSON object, no other text:
{"type":"Fuel"|"Toll"|"Parking"|"Other"|null,"merchant":string|null,"station":string|null,"location":string|null,"date":"YYYY-MM-DD"|null,"amount":number|null,"vat":number|null,"litres":number|null,"fuelGrade":string|null,"receiptNo":string|null}
"amount" is the total paid including VAT. "station" is the fuel company and branch for fuel receipts. Use null for anything you cannot read clearly. Do not guess.`;
    try {
      const response = await client.beta.messages.create({
        model: "claude-opus-5-5",
        max_tokens: 16000,
        betas: ["server-side-fallback-2026-07-01"],
        fallbacks: "default",
        output_config: { effort: "low" },
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data } },
          { type: "text", text: prompt }
        ] }]
      });
      if (response.stop_reason === "refusal") throw { code: "refused" };
      const text = response.content.filter(b => b.type === "text").map(b => b.text).join("");
      const s = text.indexOf("{"), e = text.lastIndexOf("}");
      if (s < 0 || e < s) throw { code: "invalid_json" };
      return JSON.parse(text.slice(s, e + 1));
    } catch (err) {
      if (err && err.code) throw err;
      if (err instanceof Anthropic.AuthenticationError || err instanceof Anthropic.PermissionDeniedError) throw { code: "bad_key" };
      if (err instanceof Anthropic.RateLimitError) throw { code: "rate_limited" };
      if (err instanceof Anthropic.APIConnectionError) throw { code: "offline" };
      if (err instanceof Anthropic.BadRequestError) throw { code: "bad_request", message: err.message };
      if (err instanceof SyntaxError) throw { code: "invalid_json" };
      throw { code: "error", message: err && err.message };
    }
  }
};

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function drawToCanvas(img, maxSide) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, k = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  const g = c.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function compressImage(file) {
  try {
    const url = URL.createObjectURL(file); const img = await loadImg(url); URL.revokeObjectURL(url);
    const c = drawToCanvas(img, 2400);
    return (await new Promise(r => c.toBlob(r, "image/jpeg", 0.88))) || file;
  } catch (e) { return file; }
}
async function photoCanvas(id, maxSide) { const u = await Photos.url(id); if (!u) throw new Error("missing"); return drawToCanvas(await loadImg(u), maxSide); }

    if (f.project && e.project !== f.project) return false;

function readDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return null; } }

function blankExpense(preset = {}) {
  const t = preset.tripId ? tripById(preset.tripId) : null;

        ${F.type === "Parking" ? `<div class="g2"><div class="field"><label class="lbl" for="e-loc">Location</label><input id="e-loc" data-f="location" list="dl-parking" value="${val("location")}"></div><div class="field"><label class="lbl" for="e-dur">Duration</label><input id="e-dur" data-f="duration" placeholder="e.g. 2 hours" value="${val("duration")}"></div></div>` : ""}
        ${F.type === "Other" ? `<div class="field"><label class="lbl" for="e-loc">Location</label><input id="e-loc" data-f="location" list="dl-places" value="${val("location")}"></div>` : ""}

          <div class="seg small"><button class="chip" data-pick="claimPct" data-v="100" aria-pressed="${(F.claimPct ?? 100) === 100}">Full amount</button><button class="chip" data-pick="claimPct" data-v="50" aria-pressed="${F.claimPct === 50}">50% · shared with colleague</button></div>
        </div>
        <div class="g2">
          <div class="field"><label class="lbl" for="e-status">Reimbursement status</label><select id="e-status" data-f="status">${STATUSES.map(s => `<option ${s === F.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>

      <p class="err" id="e-err" role="alert">${esc(err)}</p>`;
    drawReceipts(); drawCalc(); drawFoot();
  }
  function drawReceipts() {
    const box = $("#e-receipts", sh.body); if (!box) return;
    const rs = F.receipts || [];
    box.innerHTML = `<span class="lbl">Receipt photos <em>${rs.length ? rs.length + " attached" : "none yet"}</em></span>
      ${rs.length ? `<div class="thumbs">${rs.map((r, i) => `<div class="thumb">${photoImg(r.id, `Receipt ${i + 1}`)}<button data-rm="${i}" aria-label="Remove receipt ${i + 1}">${ic("x", 14)}</button></div>`).join("")}</div>` : ""}
      <div class="upl">
        <label class="btn brand">${ic("camera", 18)} Take photo<input class="vh" type="file" accept="image/*" capture="environment" data-file></label>
        <label class="btn">${ic("upload", 18)} Choose photo<input class="vh" type="file" accept="image/*" multiple data-file></label>
        ${rs.length && AI.available() ? `<button class="btn" data-x="ocr" ${ocrBusy ? "disabled" : ""}>${ic("spark", 18)} ${ocrBusy ? "Reading…" : "Read receipt"}</button>` : ""}
      </div>
      ${busyMsg ? `<span class="hint">${esc(busyMsg)}</span>` : ""}
      ${ocrMsg ? `<div class="ocr">${ocrMsg}</div>` : ""}
      ${!rs.length && !F.paperBill ? `<span class="hint">No photo yet. You can save without one; it will be marked “Receipt missing”.</span>` : ""}`;
    hydratePhotos(box);

  function drawCalc() {
    const box = $("#e-calc", sh.body); if (!box) return;
    const a = num(F.amount), l = num(F.litres), t = tripById(F.tripId), parts = [];
    if (a > 0 && (F.claimPct ?? 100) !== 100) parts.push(`You claim <b>${aed(a * F.claimPct / 100)}</b>`);
    if (F.type === "Fuel" && a > 0 && l > 0) parts.push(`<b>AED ${(a / l).toFixed(2)}</b> per litre`);
    if (F.type === "Fuel" && a > 0 && tripKm(t)) parts.push(`<b>AED ${(a / tripKm(t)).toFixed(2)}</b> per km on this trip`);
    box.innerHTML = parts.join("<span>·</span>");
  }
  function drawFoot() {
    sh.foot.innerHTML = confirmDel
      ? `<span class="grow small">Delete ${esc(F.code)}${(F.receipts || []).length ? ` and its ${(F.receipts || []).length} receipt photo${F.receipts.length > 1 ? "s" : ""}` : ""}?</span><button class="btn" data-x="keep">Keep</button><button class="btn solid-danger" data-x="delete-yes">Delete</button>`
      : `${existing ? `<button class="btn danger" data-x="delete">Delete</button>` : ""}<span class="grow"></span><button class="btn primary" data-x="save" style="min-width:150px">Save expense</button>`;
  }

  sh.body.addEventListener("input", ev => {
    const el = ev.target, k = el.dataset.f; if (!k || k === "tripId") return;
    F[k] = el.type === "checkbox" ? el.checked : el.value;
    if (k === "date") F._dateTouched = true;
    if (k === "paperBill") drawReceipts();
    drawCalc(); persist();
  });
  sh.body.addEventListener("change", async ev => {
    const el = ev.target;
    if (el.dataset.f === "tripId") {
      F.tripId = el.value; const t = tripById(F.tripId);
      if (t) { if (!F.purpose) F.purpose = t.purpose || ""; if (t.project && t.project !== F.project && !existing) { F.project = t.project; F.status = defaultStatus(t.project); } }
      persist(); draw(); return;

    if (el.hasAttribute("data-file") && el.files && el.files.length) { const files = [...el.files]; el.value = ""; await addPhotos(files); }
  });
  sh.body.addEventListener("click", async ev => {
    const b = ev.target.closest("button"); if (!b || !sh.body.contains(b)) return;

    if (b.dataset.rm != null) { F.receipts.splice(+b.dataset.rm, 1); persist(); drawReceipts(); drawFoot(); return; }
    const x = b.dataset.x; if (!x) return;

    if (x === "discard") {
      for (const r of (F.receipts || [])) if (!S.expenses.some(e => (e.receipts || []).some(q => q.id === r.id))) await Photos.remove(r.id).catch(() => {});

    else if (x === "add-project") { addingProject = !addingProject; draw(); const i = $("#e-newproj", sh.body); if (i) i.focus(); }

      const n = ($("#e-newproj", sh.body).value || "").trim();

      F.project = n; F.status = defaultStatus(n); addingProject = false; persist(); draw();
    }
    else if (x === "new-trip") openTrip(null, { project: F.project, onSaved: t => { F.tripId = t.id; if (!F.purpose) F.purpose = t.purpose; persist(); draw(); } });
    else if (x === "vat5") { const a = num(F.amount); if (a > 0) { F.vat = String(r2(a * 5 / 105)); $("#e-vat", sh.body).value = F.vat; persist(); } else toast("Enter the amount first."); }
    else if (x === "ocr") await runOcr();
  });
  sh.foot.addEventListener("click", async ev => {
    const b = ev.target.closest("button[data-x]"); if (!b) return;
    const x = b.dataset.x;
    if (x === "save") await save();
    else if (x === "delete") { confirmDel = true; drawFoot(); }
    else if (x === "keep") { confirmDel = false; drawFoot(); }
    else if (x === "delete-yes") await del();
  });

  async function addPhotos(files) {
    for (let i = 0; i < files.length; i++) {
      busyMsg = files.length > 1 ? `Saving photo ${i + 1} of ${files.length}…` : "Saving photo…"; drawReceipts();
      try {
        const blob = await compressImage(files[i]);
        const pid = await Photos.add(blob);
        F.receipts = F.receipts || []; F.receipts.push({ id: pid, at: Date.now() });
        persist();
      } catch (e) {
        toast(e && e.name === "QuotaExceededError" ? "Your phone is out of space for photos. Free up storage and try again." : "Couldn't save the photo. Try again.", "bad", 5000);
      }
    }
    busyMsg = ""; drawReceipts(); drawFoot();
  }

  async function runOcr() {
    const last = F.receipts[F.receipts.length - 1]; if (!last) return;
    if (!navigator.onLine) { ocrMsg = "Receipt reading needs internet. Enter the details yourself, or try again when you're online."; drawReceipts(); return; }
    ocrBusy = true; ocrMsg = "Reading the receipt. This takes a few seconds…"; drawReceipts();
    try {
      const c = await photoCanvas(last.id, 1600);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
      const r = await AI.readReceipt(blob);
      const filled = [], seen = [];
      const amt = num(r.amount), cur = num(F.amount);
      if (amt > 0) { seen.push(`total ${aed(amt)}`); if (!(cur > 0)) { F.amount = String(r2(amt)); filled.push("amount"); } }
      if (validISO(r.date)) { seen.push(fmtDMY(r.date)); if (!F._dateTouched && r.date !== F.date && r.date <= todayISO()) { F.date = r.date; filled.push("date"); } }
      const vat = num(r.vat); if (r.vat != null && vat >= 0) { seen.push(`VAT ${aed(vat)}`); if (F.vat === "" || F.vat == null) { F.vat = String(r2(vat)); filled.push("VAT"); } }
      const lit = num(r.litres); if (lit > 0) { seen.push(`${lit} L`); if (F.type === "Fuel" && !(num(F.litres) > 0)) { F.litres = String(lit); filled.push("litres"); } }
      if (r.station || r.merchant) seen.push(r.station || r.merchant);
      if (F.type === "Fuel" && !F.station && (r.station || r.merchant)) { F.station = String(r.station || r.merchant); filled.push("station"); }
      if (F.type !== "Fuel" && !F.merchant && r.merchant) { F.merchant = String(r.merchant); filled.push("merchant"); }
      if (F.type !== "Fuel" && !F.location && r.location) { F.location = String(r.location); filled.push("location"); }
      if (!F.receiptNo && r.receiptNo) { F.receiptNo = String(r.receiptNo); filled.push("receipt no."); }
      if (!F.description && F.type === "Fuel" && r.fuelGrade) { F.description = [r.station || r.merchant, r.fuelGrade].filter(Boolean).join(" – "); filled.push("description"); }
      let warn = "";
      if (amt > 0 && cur > 0 && Math.abs(amt - cur) > 0.009) warn = `<br><b>Check:</b> the receipt total ${aed(amt)} differs from the amount you entered (${aed(cur)}).`;
      if (r.type && CATS.includes(r.type) && r.type !== F.type) warn += `<br>This looks like a <b>${esc(r.type)}</b> receipt. You chose ${esc(F.type)}.`;
      ocrMsg = `<b>Read from receipt:</b> ${esc(seen.join(" · ") || "nothing clear")}<br>${filled.length ? `Filled ${esc(filled.join(", "))}. Check them before saving.` : "No empty fields to fill."}${warn}`;
      persist();
    } catch (e) {
      const code = e && e.code;
      ocrMsg = code === "bad_key" ? "Your Claude API key wasn't accepted. Check it in Settings." : code === "rate_limited" ? "Too many requests right now. Try again in a minute." : code === "offline" ? "Couldn't reach Claude. Check your internet connection." : code === "refused" ? "This photo couldn't be read. Enter the details yourself." : "Couldn't read this receipt. Enter the details yourself.";
    }
    ocrBusy = false; draw();
  }

  function validate() {
    const amount = num(F.amount);
    if (!F.project) return "Choose a project.";
    if (amount == null) return "Enter the amount in AED.";
    if (isNaN(amount)) return "The amount must be a number, like 150 or 150.50.";
    if (amount <= 0) return "The amount must be more than zero.";
    if (amount > 100000) return "That amount looks too high. Check the figure.";
    if (!validISO(F.date)) return "Enter a valid date.";
    if (F.date > todayISO()) return "The date can't be in the future.";
    const vat = num(F.vat); if (vat != null && (isNaN(vat) || vat < 0 || vat > amount)) return "VAT must be between 0 and the amount.";
    const l = num(F.litres); if (l != null && (isNaN(l) || l <= 0 || l > 500)) return "Litres must be a number above zero.";
    const o = num(F.odometer); if (o != null && (isNaN(o) || o < 0)) return "The odometer reading must be zero or more.";
    if (F.type === "Other" && !String(F.description || "").trim()) return "Add a short description for Other expenses, such as “Taxi to site”.";
    return "";
  }
  async function save() {
    err = validate();
    const errEl = $("#e-err", sh.body); if (errEl) errEl.textContent = err;
    if (err) { errEl && errEl.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    const obj = {};
    Object.keys(F).forEach(k => { if (!k.startsWith("_")) obj[k] = F[k]; });
    obj.amount = r2(num(F.amount));
    ["vat", "litres", "odometer"].forEach(k => { const n = num(F[k]); obj[k] = n == null || isNaN(n) ? null : (k === "odometer" ? Math.round(n) : r2(n)); });
    ["description", "purpose", "station", "location", "duration", "merchant", "receiptNo", "reimbNotes", "notes"].forEach(k => obj[k] = String(F[k] || "").trim());
    obj.claimPct = F.claimPct ?? 100;
    obj.receipts = (F.receipts || []).map(r => ({ id: r.id, at: r.at || Date.now() }));
    if (!obj.code) { const [y, m] = obj.date.split("-"); obj.code = nextCode(`EXP-${y}-${m}-`, S.expenses, 4); }
    obj.createdAt = obj.createdAt || Date.now(); obj.updatedAt = Date.now();
    try {
      await Store.put("expenses", obj);
      const removed = originalReceipts.filter(rid => !obj.receipts.some(r => r.id === rid));
      for (const rid of removed) await Photos.remove(rid).catch(() => {});
      if (!existing) clearDraft();
      sh.close();
      toast(`${existing ? "Updated" : "Saved"} ${obj.code} · ${aed(obj.amount)}`);
    } catch (e) {
      err = e && e.name === "QuotaExceededError" ? "Your phone is out of storage. Free up space and tap Save again; your entry is kept." : "Couldn't save. Tap Save again; your entry is kept.";
      const el = $("#e-err", sh.body); if (el) el.textContent = err;
    }
  }
  async function del() {
    try {
      await Store.remove("expenses", F.id);
      for (const r of (existing.receipts || [])) await Photos.remove(r.id).catch(() => {});
      sh.close(); toast(`Deleted ${F.code}`);
    } catch (e) { toast("Couldn't delete. Try again.", "bad"); }
  }
  draw();
}

/* ===================== Trip form & detail ===================== */
function openTrip(id, opts = {}) {
  const existing = id ? tripById(id) : null;
  const T = existing ? structuredClone(existing) : { id: uid(), code: "", date: todayISO(), project: opts.project || lastProject(), purpose: "Deployment", from: S.settings.home || "", to: "", km: "", roundTrip: true, route: "", notes: "" };
  if (T.km == null) T.km = "";
  let fromGeo = null;
  const sh = openSheet(existing ? "Edit trip" : "New trip", existing ? existing.code : "");
  let err = "", estMsg = "", estBusy = false, gpsBusy = false, confirmDel = false;
  const val = k => esc(T[k] ?? "");
  const mapsUrl = () => `https://maps.apple.com/?saddr=${encodeURIComponent((T.from || "") + ", UAE")}&daddr=${encodeURIComponent((T.to || "") + ", UAE")}&dirflg=d`;
  function draw() {
    const projects = projectList(); if (T.project && !projects.includes(T.project)) projects.push(T.project);
    sh.body.innerHTML = `
      <div class="g2">
        <div class="field"><label class="lbl" for="t-date">Date</label><input id="t-date" type="date" data-f="date" max="${todayISO()}" value="${val("date")}"></div>
        <div class="field"><label class="lbl" for="t-purpose">Purpose</label><input id="t-purpose" data-f="purpose" list="dl-purposes" value="${val("purpose")}"></div>
      </div>
      <div class="seg small" role="group" aria-label="Purpose">${PURPOSES.map(p => `<button class="chip" data-pick="purpose" data-v="${p}" aria-pressed="${T.purpose === p}">${p}</button>`).join("")}</div>
      <div class="field"><span class="lbl">Project</span><div class="seg" role="group" aria-label="Project">${projects.map(p => `<button class="chip" data-pick="project" data-v="${esc(p)}" aria-pressed="${T.project === p}">${esc(p)}</button>`).join("")}</div></div>
      <div class="field"><label class="lbl" for="t-from">Starting location <button class="link small" data-x="gps" ${gpsBusy ? "disabled" : ""}>${gpsBusy ? "Finding you…" : "Use my location"}</button></label><input id="t-from" data-f="from" list="dl-places" placeholder="e.g. Khalifa City, Abu Dhabi" value="${val("from")}"></div>
      <div class="field"><label class="lbl" for="t-to">Destination</label><input id="t-to" data-f="to" list="dl-places" placeholder="Ruwais, Al Ain, a site or company name" value="${val("to")}"></div>
      <div class="card stack" style="padding:14px">
        <div class="upl">
          <button class="btn brand" data-x="estimate" ${estBusy ? "disabled" : ""}>${ic("route", 18)} ${estBusy ? "Calculating…" : "Calculate distance"}</button>
          <a class="btn" id="t-maps" href="${mapsUrl()}" target="_blank" rel="noopener">${ic("map", 18)} Open in Maps</a>
        </div>
        ${estMsg ? `<div class="ocr" id="t-est">${estMsg}</div>` : ""}
        <div class="g2">
          <div class="field"><label class="lbl" for="t-km">One-way distance <em>km</em></label><input id="t-km" data-f="km" type="number" inputmode="decimal" min="0" step="1" value="${val("km")}"></div>
          <div class="field"><span class="lbl">Round trip</span><label class="check" style="min-height:46px"><input id="t-rt" type="checkbox" data-f="roundTrip" ${T.roundTrip ? "checked" : ""}> I drove back</label></div>
        </div>
        <div class="calc" id="t-calc"></div>
        <span class="attrib">Map data © OpenStreetMap contributors · Routing by OSRM</span>
      </div>
      <div class="field"><label class="lbl" for="t-notes">Notes</label><textarea id="t-notes" data-f="notes">${val("notes")}</textarea></div>
      <p class="err" id="t-err" role="alert">${esc(err)}</p>`;
    drawCalc(); drawFoot();
  }
  function drawCalc() {
    const k = num(T.km), el = $("#t-calc", sh.body); if (!el) return;
    el.innerHTML = k > 0 ? `Estimated distance <b>${kmTxt(k)}</b><span>·</span>Round trip <b>${kmTxt(k * 2)}</b><span>·</span>Counted <b>${kmTxt(T.roundTrip ? k * 2 : k)}</b>` : "Calculate the distance or type the km.";
    const a = $("#t-maps", sh.body); if (a) a.href = mapsUrl();
  }
  function drawFoot() {
    sh.foot.innerHTML = confirmDel
      ? `<span class="grow small">Delete ${esc(T.code)}? Its expenses stay, without a trip.</span><button class="btn" data-x="keep">Keep</button><button class="btn solid-danger" data-x="delete-yes">Delete</button>`
      : `${existing ? `<button class="btn danger" data-x="delete">Delete</button>` : ""}<span class="grow"></span><button class="btn primary" data-x="save" style="min-width:130px">Save trip</button>`;
  }
  sh.body.addEventListener("input", ev => {
    const el = ev.target, k = el.dataset.f; if (!k) return;
    T[k] = el.type === "checkbox" ? el.checked : el.value;
    if (k === "from") fromGeo = null;
    if (k === "purpose") sh.body.querySelectorAll("[data-pick=purpose]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === T.purpose));
    drawCalc();
  });
  const onClick = async ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.pick) { T[b.dataset.pick] = b.dataset.v; draw(); return; }
    const x = b.dataset.x; if (!x) return;
    ev.preventDefault();
    if (x === "estimate") await estimate();
    else if (x === "gps") await useGps();
    else if (x === "save") await save();
    else if (x === "delete") { confirmDel = true; drawFoot(); }
    else if (x === "keep") { confirmDel = false; drawFoot(); }
    else if (x === "delete-yes") await del();
  };
  sh.body.addEventListener("click", onClick); sh.foot.addEventListener("click", onClick);
  async function useGps() {
    gpsBusy = true; draw();
    try {
      const p = await Geo.here(); fromGeo = p;
      try { T.from = await Geo.reverse(p.lat, p.lon); } catch (e) { T.from = `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`; }
      estMsg = "";
    } catch (e) {
      estMsg = e && e.code === 1 ? "Location access is off. Allow it in Settings › Privacy › Location Services › Safari Websites, or type the starting point." : "Couldn't find your location. Type the starting point.";
    }
    gpsBusy = false; draw();
  }
  async function estimate() {
    const from = String(T.from || "").trim(), to = String(T.to || "").trim();
    if (!from || !to) { estMsg = "Enter both the starting location and the destination first."; draw(); return; }
    if (!navigator.onLine) { estMsg = "You're offline. Type the km, or calculate it later when you have internet."; draw(); return; }
    estBusy = true; estMsg = "Finding both places…"; draw();
    try {
      const a = fromGeo || await Geo.search(from);
      if (!fromGeo) await sleep(1100); // OpenStreetMap allows one search per second
      const b = await Geo.search(to);
      if (!a || !b) throw { code: "notfound", which: !a ? from : to };
      estMsg = "Working out the driving route…"; draw();
      const r = await Geo.route(a, b);
      const k = Math.round(r.km);
      T.km = String(k);
      const short = s => esc(String(s).split(",").slice(0, 3).join(","));
      estMsg = `<b>${kmTxt(k)} one way</b> by road, about ${r.minutes >= 60 ? Math.floor(r.minutes / 60) + " h " : ""}${Math.round(r.minutes % 60)} min.<br><span class="muted">${fromGeo ? esc(from) : short(a.name)} → ${short(b.name)}. If a place is wrong, add more detail (area, emirate) and calculate again.</span>`;
    } catch (e) {
      estMsg = e && e.code === "notfound" ? `Couldn't find “${esc(e.which)}” on the map. Add the area or emirate, or type the km.` : "Couldn't calculate the route right now. Type the km, or try again later.";
    }
    estBusy = false; draw();
  }
  async function save() {
    const k = num(T.km);
    err = !validISO(T.date) ? "Enter a valid date." : T.date > todayISO() ? "The date can't be in the future." : !String(T.to || "").trim() ? "Enter the destination." : (k != null && (isNaN(k) || k < 0 || k > 2000)) ? "The distance must be between 0 and 2,000 km." : !T.project ? "Choose a project." : "";
    const el = $("#t-err", sh.body); if (el) el.textContent = err; if (err) return;
    const obj = { ...T, km: k == null || isNaN(k) ? null : Math.round(k), from: String(T.from || "").trim(), to: String(T.to || "").trim(), purpose: String(T.purpose || "").trim() || "Trip", notes: String(T.notes || "").trim(), roundTrip: !!T.roundTrip };
    if (!obj.code) { const [y, m] = obj.date.split("-"); obj.code = nextCode(`TRP-${y}-${m}-`, S.trips, 3); }
    obj.createdAt = obj.createdAt || Date.now();
    try { await Store.put("trips", obj); sh.close(); toast(`${existing ? "Updated" : "Saved"} ${obj.code} · ${tripName(obj)}`); opts.onSaved && opts.onSaved(obj); }
    catch (e) { const el2 = $("#t-err", sh.body); if (el2) el2.textContent = "Couldn't save. Tap Save again."; }
  }
  async function del() {
    try {
      for (const e of S.expenses.filter(e => e.tripId === T.id)) await Store.put("expenses", { ...e, tripId: "" });
      await Store.remove("trips", T.id); sh.close(); toast(`Deleted ${T.code}`);
    } catch (e) { toast("Couldn't delete. Try again.", "bad"); }
  }
  draw();
}

/* ===================== Excel ===================== */
async function buildExcel(key, project) {
  await loadLib("xlsx");
  const X = window.XLSX; if (!X) throw new Error("lib");
  const d = monthData(key, project), list = d.ex.slice().sort(byOldest);
  const trips = d.tr.slice().sort(byOldest);
  const s = S.settings, label = monthLabel(key) + (project ? ` · ${project}` : "");
  const B = { style: "thin", color: { rgb: "C9D1D9" } }, border = { top: B, bottom: B, left: B, right: B };
  const st = {
    title: { font: { bold: true, sz: 16, color: { rgb: "0F4F5E" } } },
    sub: { font: { sz: 10, color: { rgb: "586673" } } },
    head: { font: { bold: true, sz: 10, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "0F4F5E" } }, alignment: { horizontal: "center", vertical: "center", wrapText: true }, border },
    cell: { font: { sz: 10 }, border, alignment: { vertical: "top", wrapText: true } },
    date: { font: { sz: 10 }, border, numFmt: "dd/mm/yyyy", alignment: { vertical: "top", horizontal: "left" } },
    money: { font: { sz: 10 }, border, numFmt: "#,##0.00", alignment: { vertical: "top" } },
    int: { font: { sz: 10 }, border, numFmt: "#,##0", alignment: { vertical: "top" } },
    miss: { font: { sz: 10, bold: true, color: { rgb: "C2372D" } }, border, alignment: { vertical: "top" } },
    tlabel: { font: { bold: true, sz: 10 }, fill: { fgColor: { rgb: "FFF1D6" } }, border },
    tmoney: { font: { bold: true, sz: 10 }, fill: { fgColor: { rgb: "FFF1D6" } }, border, numFmt: "#,##0.00" },
    tint: { font: { bold: true, sz: 10 }, fill: { fgColor: { rgb: "FFF1D6" } }, border, numFmt: "#,##0" },
    klabel: { font: { sz: 10, color: { rgb: "586673" } }, border },
    kval: { font: { bold: true, sz: 10 }, border, numFmt: "#,##0.00" },
    kint: { font: { bold: true, sz: 10 }, border, numFmt: "#,##0" }
  };
  const serial = iso => { const [y, m, dd] = iso.split("-").map(Number); return (Date.UTC(y, m - 1, dd) - Date.UTC(1899, 11, 30)) / 86400000; };
  function mk() {
    const ws = {}; let maxR = 0, maxC = 0;
    return {
      set(r, c, v, sty, f) {
        const cell = { v: v == null ? "" : v, t: typeof v === "number" ? "n" : "s", s: sty };
        if (f) { cell.f = f; cell.t = "n"; if (v == null || v === "") cell.v = 0; }
        ws[X.utils.encode_cell({ r, c })] = cell; maxR = Math.max(maxR, r); maxC = Math.max(maxC, c);
      },
      done(cols, extra = {}) { ws["!ref"] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } }); ws["!cols"] = cols.map(w => ({ wch: w })); Object.assign(ws, extra); return ws; }
    };
  }
  const who = [s.name, s.designation, s.employeeId ? "Employee ID " + s.employeeId : ""].filter(Boolean).join(" · ");
  const wb = X.utils.book_new();

  // Sheet 1 — Expense Details
  const H = ["Expense ID", "Date", "Project", "Expense Type", "Purpose", "Trip ID", "Starting Location", "Destination", "Distance KM", "Round Trip KM", "Fuel Station / Merchant", "Litres", "Amount (AED)", "VAT (AED)", "Claim %", "Claimable (AED)", "Location", "Receipt File Name", "Receipt", "Reimbursement Status", "Reimbursement Notes", "Notes / Description"];
  const a = mk();
  a.set(0, 0, `Travel Expense Report — ${label}`, st.title);
  a.set(1, 0, who || "Employee details: add them in Road Claims settings", st.sub);
  a.set(2, 0, `Generated ${fmtDMY(todayISO())} with Road Claims`, st.sub);
  H.forEach((h, c) => a.set(4, c, h, st.head));
  const first = 6, last = 5 + list.length;
  list.forEach((e, i) => {
    const r = 5 + i, R = r + 1, t = tripById(e.tripId);
    a.set(r, 0, e.code, st.cell);
    a.set(r, 1, serial(e.date), st.date);
    a.set(r, 2, e.project, st.cell);
    a.set(r, 3, e.type, st.cell);
    a.set(r, 4, e.purpose || (t ? t.purpose : ""), st.cell);
    a.set(r, 5, t ? t.code : "", st.cell);
    a.set(r, 6, t ? t.from : "", st.cell);
    a.set(r, 7, t ? t.to : "", st.cell);
    a.set(r, 8, t && t.km ? +t.km : "", st.int);

/* ===================== Receipt PDF ===================== */
async function buildPdf(key, project, progress) {
  await loadLib("pdf");
  const { jsPDF } = window.jspdf;
  const d = monthData(key, project), list = d.ex.slice().sort(byOldest);
  const doc = new jsPDF({ unit: "mm", format: "a4", compress: true });
  const W = 210, H = 297, M = 14;
  const clean = s => String(s ?? "").replace(/[—–]/g, "-").replace(/[^\x20-\x7E -ÿ]/g, "");
  const money = n => "AED " + nf2.format(+n || 0);
  const s = S.settings;
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(17, 28, 37);
  doc.text(clean(`${monthLabel(key)} - Expense Receipts${project ? " (" + project + ")" : ""}`), M, 22);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(88, 102, 115);
  doc.text(clean([s.name, s.designation, s.employeeId ? "Employee ID " + s.employeeId : ""].filter(Boolean).join("  |  ") || "Road Claims"), M, 29);
  doc.text(clean(`Total ${money(d.total)}  |  Claimable ${money(d.claim)}  |  ${d.receipts} receipt photo(s)  |  ${d.missing} missing`), M, 35);
  let y = 46;
  const cols = [M, M + 38, M + 60, M + 80, M + 99];
  const header = () => { doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(17, 28, 37); ["Expense ID", "Date", "Project", "Type", "Description"].forEach((h, i) => doc.text(h, cols[i], y)); doc.text("Amount", W - M - 22, y, { align: "right" }); doc.text("Receipt", W - M, y, { align: "right" }); doc.setDrawColor(201, 209, 217); doc.line(M, y + 2, W - M, y + 2); y += 7; doc.setFont("helvetica", "normal"); };
  header();
  list.forEach(e => {
    if (y > H - 16) { doc.addPage(); y = 20; header(); }
    doc.setTextColor(17, 28, 37);
    doc.text(clean(e.code), cols[0], y); doc.text(fmtDMY(e.date), cols[1], y); doc.text(clean(e.project).slice(0, 10), cols[2], y); doc.text(clean(e.type), cols[3], y);
    doc.text(doc.splitTextToSize(clean(describe(e)), W - M - 40 - cols[4])[0] || "", cols[4], y);
    doc.text(money(e.amount), W - M - 22, y, { align: "right" });
    const rs = receiptState(e); if (rs === "Missing") doc.setTextColor(194, 55, 45);
    doc.text(rs === "Photo" ? String(receiptCount(e)) : rs, W - M, y, { align: "right" });
    y += 6;
  });
  doc.setDrawColor(201, 209, 217); doc.line(M, y - 3, W - M, y - 3);
  doc.setFont("helvetica", "bold"); doc.setTextColor(17, 28, 37); doc.text("Total", cols[0], y + 2); doc.text(money(d.total), W - M - 22, y + 2, { align: "right" });
  const total = list.reduce((n, e) => n + receiptCount(e), 0); let done = 0;
  for (const e of list) {
    const rs = e.receipts || [];
    for (let i = 0; i < rs.length; i++) {
      progress && progress(++done, total);
      doc.addPage();
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(17, 28, 37);
      doc.text(clean(`${e.code}   ${money(e.amount)}`), M, 16);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(88, 102, 115);
      const t = tripById(e.tripId);
      doc.text(clean(`${fmtDate(e.date)}  |  ${e.project}  |  ${e.type}  |  Receipt ${i + 1} of ${rs.length}`), M, 22);
      doc.text(doc.splitTextToSize(clean(describe(e) + (t ? "  |  Trip " + t.code + ": " + tripName(t) : "")), W - 2 * M)[0] || "", M, 27);
      const top = 33, boxW = W - 2 * M, boxH = H - top - 14;
      try {
        const c = await photoCanvas(rs[i].id, 2400);
        const k = Math.min(boxW / c.width, boxH / c.height), w = c.width * k, h = c.height * k;
        doc.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", M + (boxW - w) / 2, top, w, h, undefined, "FAST");
      } catch (err) { doc.setTextColor(194, 55, 45); doc.text("This receipt photo could not be loaded.", M, top + 10); }
      doc.setFontSize(8); doc.setTextColor(150, 160, 170); doc.text(clean(receiptFileName(e, i)), W - M, H - 8, { align: "right" });
    }
  }
  return doc.output("blob");
}

/* ===================== Email ===================== */
function emailDraft(key, project) {
  const d = monthData(key, project), label = monthLabel(key), s = S.settings, base = fileBase(key, project);
  const projects = project ? [project] : projectOrder(d.proj);
  const line = (l, v) => `${l}: ${v}`;
  const lines = [
    "Dear Team,", "",
    `Please find attached the expense report and supporting receipts for ${label}${project ? ` (${project} project)` : ""}.`, "",
    line("Reporting month", label),
    line("Project", projects.join(", ") || "-"),
    line("Fuel", aed(d.cat.Fuel)),
    line("Toll", aed(d.cat.Toll)),
    line("Parking", aed(d.cat.Parking)),
    line("Other", aed(d.cat.Other)),
    line("Total expenses", aed(d.total)),
    line("Total reimbursement amount", aed(d.claim))
  ];
  if (!project && projects.length > 1) { lines.push("", "By project:"); projects.forEach(p => lines.push(`- ${p}: ${aed(d.proj[p].total)} (claimable ${aed(d.proj[p].claim)})`)); }
  lines.push("", `Trips: ${d.tr.length} | Distance: ${kmTxt(d.dist)} | Receipts: ${d.receipts}`);
  lines.push("", "Attachments:", `- ${base}_Expense_Report.xlsx`);
  if (d.receipts) lines.push(`- ${base}_Receipts.pdf`);
  lines.push("", "Please let me know if you need anything else.", "", "Kind regards,");
  [s.name, s.designation, s.employeeId ? "Employee ID: " + s.employeeId : ""].filter(Boolean).forEach(l => lines.push(l));
  return { subject: `Expense Claim – ${label}${project ? " – " + project : ""}${s.name ? " – " + s.name : ""}`, body: lines.join("\n"), missing: d.missing };
}

$("#restoreFile").addEventListener("change", async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  let data, photos = [];

      await loadLib("zip");
      const zip = await window.JSZip.loadAsync(f);
      const jf = zip.file("road-claims-data.json"); if (!jf) throw new Error("bad");
